<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rahim Community</title>

    <meta name="description" content="গুরুত্বপূর্ণ আপডেট, তথ্য ও কনটেন্ট পেতে আমাদের Telegram community-তে যুক্ত হন।">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: #f5faff;
            color: #111827;
        }

        .navbar {
            width: 100%;
            background: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
        }

        .top-button {
            text-decoration: none;
            background: #229ed9;
            color: white;
            padding: 16px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
        }

        .hero {
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(135deg, #f4faff, #ffffff);
        }

        .hero h1 {
            max-width: 1000px;
            font-size: 52px;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .hero p {
            max-width: 800px;
            font-size: 23px;
            line-height: 1.7;
            color: #374151;
            margin-bottom: 40px;
        }

        .cta-button {
            display: inline-block;
            text-decoration: none;
            background: #229ed9;
            color: white;
            padding: 20px 42px;
            border-radius: 14px;
            font-size: 24px;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(34, 158, 217, 0.25);
            transition: 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            padding: 25px;
            background: white;
            color: #6b7280;
        }

        @media (max-width: 768px) {

            .navbar {
                padding: 18px 20px;
            }

            .logo {
                font-size: 22px;
            }

            .top-button {
                padding: 12px 16px;
                font-size: 15px;
            }

            .hero {
                min-height: 600px;
                padding: 50px 20px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 18px;
            }

            .cta-button {
                font-size: 20px;
                padding: 17px 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="navbar">

        <div class="logo">
            Rahim Community
        </div>

        <!-- Telegram Link -->
        <a
            class="top-button"
            href="https://t.me/+zIwyiSqzD4I3MzZl"
            target="_blank"
            rel="noopener noreferrer"
        >
            Join Telegram
        </a>

    </header>


    <!-- Main Landing Page -->
    <main>

        <section class="hero">

            <h1>
                আপনার জন্য গুরুত্বপূর্ণ আপডেট
                ও তথ্য এক জায়গায়
            </h1>

            <p>
                আমাদের Telegram community-তে যুক্ত হন এবং
                নিয়মিত আপডেট, তথ্য ও গুরুত্বপূর্ণ কনটেন্ট
                সরাসরি পেতে শুরু করুন।
            </p>

            <!-- Main CTA -->
            <a
                class="cta-button"
                href="https://t.me/+zIwyiSqzD4I3MzZl"
                target="_blank"
                rel="noopener noreferrer"
            >
                🚀 Telegram-এ Join করুন
            </a>

        </section>

    </main>


    <footer class="footer">
        © 2026 Rahim Community
    </footer>

</body>
</html>
