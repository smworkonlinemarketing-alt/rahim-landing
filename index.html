    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;
    n.push=n;
    n.loaded=!0;
    n.version='2.0';

    /* Your Meta Pixel */
    fbq('init', '939346592097569');

    /* =========================
       TELEGRAM CLICK + SUBSCRIBE
       ========================= */

    function trackTelegramClick(buttonLocation) {

        if (typeof fbq === 'function') {

            /* Telegram Click Event */
            fbq(
                'trackCustom',
                'TelegramClick',
                {
                    button_location: buttonLocation
                }
            );

            /* Subscribe Event */
            fbq(
                'track',
                'Subscribe',
                {
                    button_location: buttonLocation
                }
            );

        }

    }
    </script>
